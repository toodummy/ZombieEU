name: fetch-assets
on:
  push:
    branches: [assets-pipeline]
    paths: ['assets/manifest.json', 'tools/fetch_assets.py', '.github/workflows/fetch-assets.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: fetch-assets, cancel-in-progress: false }
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fetch_assets.py
      - name: Commit fetched assets in small batches
        run: |
          git config user.name "asset-bot"
          git config user.email "asset-bot@users.noreply.github.com"
          git config http.postBuffer 524288000
          push() { for t in 1 2 3 4; do git push && return 0; sleep 10; git pull --rebase -q || true; done; return 1; }
          for d in assets/hdri assets/tex assets/sfx assets/gen $(ls -d assets/models/* 2>/dev/null) assets; do
            [ -e "$d" ] || continue
            git add "$d"
            if ! git diff --cached --quiet; then git commit -q -m "[asset-bot] fetch ${d#assets/}"; push; fi
          done
