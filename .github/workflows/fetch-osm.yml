name: fetch-osm
on:
  push:
    branches: [assets-pipeline]
    paths: [tools/fetch_osm.py, .github/workflows/fetch-osm.yml]
permissions: { contents: write }
jobs:
  osm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
      - run: python3 tools/fetch_osm.py && ls -la assets/osm
      - run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add assets/osm && git commit -m "OSM data: Tower Bridge to Old Kent Road (© OpenStreetMap contributors, ODbL)" && for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
