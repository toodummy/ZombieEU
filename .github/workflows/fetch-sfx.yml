name: fetch-sfx
on:
  push:
    branches: [assets-pipeline]
    paths: [tools/fetch_sfx.py, .github/workflows/fetch-sfx.yml]
permissions: { contents: write }
jobs:
  sfx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: python3 tools/fetch_sfx.py && ls -la assets/sfx_cc0 | head -80
      - run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add assets/sfx_cc0 && git commit -m "CC0 sound packs (Kenney)" && for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
